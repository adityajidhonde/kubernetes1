name: Build and Push to Docker Hub

# 1. THE TRIGGER: When should this run?
on:
  push:
    branches:
      - main

# 2. THE JOBS: What should it do?
jobs:
  build-push-images:
    # Spin up a temporary Ubuntu server to do the work
    runs-on: ubuntu-latest

    steps:
      # Step A: Download your code onto the temporary server
      - name: Checkout Code
        uses: actions/checkout@v4

      # Step B: Log into Docker Hub securely
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Step C: Build and Push the Node App
      - name: Build and Push Node Frontend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/node-frontend:latest ./node-app
          docker push ${{ secrets.DOCKER_USERNAME }}/node-frontend:latest

      # Step D: Build and Push the Java App
      - name: Build and Push Java Backend
        run: |
          docker build -t ${{ secrets.DOCKER_USERNAME }}/java-backend:latest ./spring-app
          docker push ${{ secrets.DOCKER_USERNAME }}/java-backend:latest